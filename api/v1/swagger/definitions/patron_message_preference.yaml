---
type: object
additionalProperties: false
required:
  - message_name
  - days_in_advance
  - wants_digest
  - message_transport_types
properties:
  message_name:
    description: Message name from message_attributes
    type: string
    minLength: 1
    maxLength: 40
  days_in_advance:
    description: Advance notice days, or null when not applicable
    type:
      - integer
      - "null"
    minimum: 0
    maximum: 30
  wants_digest:
    description: Whether messages should be delivered as a digest
    type: boolean
  message_transport_types:
    description: Selected transport types; an empty array disables delivery
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1
      maxLength: 20
